{{define "page_content"}}

<h3>Внести новую операцию</h3>

<form action="/" method="POST">
    <label>Какая сумма потрачена:</label>
    <input type="number" step="0.01" name="sum" required placeholder="Например: 500">
    
    <label>Наименование покупки:</label>
    <input type="text" name="title" required placeholder="Например: Проездной билет">
    
    <label>Какое число (дата):</label>
    <input type="date" name="date" required>
    
    <button type="submit" class="submit-btn">Записать в журнал</button>
</form>

<h3>Архив записей</h3>
<table>
    <thead>
        <tr>
            <th>Размер траты</th>
            <th>Описание операции</th>
            <th>Дата фиксации</th>
        </tr>
    </thead>
    <tbody>
        <!-- Перебираем все расходы, которые нам прислал Go из временной памяти -->
        {{range .}}
        <tr>
            <td><b>{{.Sum}}</b> руб.</td>
            <td>{{.Title}}</td>
            <td>{{.CreatedAt}}</td>
        </tr>
        {{else}}
        
        <tr>
            <td colspan="3" style="text-align: center; color: #aaa; font-style: italic;">Записей пока нет. Добавь что-нибудь сверху!</td>
        </tr>
        {{end}}
    </tbody>
</table>

{{end}}
