{{define "page_content"}}

<h3>Внести новую операцию</h3>
<form action="/" method="POST">
    <label>Сумма:</label> <input type="number" step="0.01" name="sum" required><br>
    <label>Покупка:</label> <input type="text" name="title" required><br>
    <label>Дата:</label> <input type="date" name="date" required><br>
    <button type="submit" class="submit-btn">Добавить</button>
</form>

<h3>Архив записей</h3>
<table>
    <thead>
        <tr>
            <th>Сумма</th>
            <th>Описание</th>
            <th>Дата</th>
            <th>Опции</th>
        </tr>
    </thead>
    <tbody>
        {{range .}}
        <tr>
            <td>{{.Sum}} руб.</td>
            <td>{{.Title}}</td>
            <td>{{.Date}}</td>
            <td>
                <form action="/cancel" method="POST" style="margin:0; padding:0; display:inline;">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <button type="submit" class="delete-link" onclick="return confirm('Удалить?')">Убрать</button>
                </form>
            </td>
        </tr>
        {{else}}
        <tr>
            <td colspan="4" style="text-align: center; color: #aaa;">Трат пока нет.</td>
        </tr>
        {{end}}
    </tbody>
</table>

{{end}}
